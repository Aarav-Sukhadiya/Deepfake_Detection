[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfdetect"
version = "0.1.0"
description = "Local deepfake detection for images and videos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aarav" }]
keywords = ["deepfake", "detection", "computer-vision", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.0",
    "facenet-pytorch>=2.5.3",
    "opencv-python>=4.9",
    "decord>=0.6.0",
    "Pillow>=11.0",
    "numpy>=2.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "SQLAlchemy>=2.0",
    "gradio>=4.20",
    "jinja2>=3.1",
    "filetype>=1.2.0",
    "grad-cam>=1.5.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
dfdetect = "dfdetect.cli:app"

[project.urls]
Homepage = "https://github.com/aarav/dfdetect"

[tool.setuptools.packages.find]
include = ["dfdetect*"]
exclude = ["tests*", "samples*"]

[tool.setuptools.package-data]
dfdetect = ["templates/*.html.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
files = ["dfdetect"]

[[tool.mypy.overrides]]
# Heavy ML deps are lazy-imported and don't ship type stubs. The whole module
# tree under ``dfdetect`` already uses ``from __future__ import annotations``
# so most function signatures are str literals; this block keeps mypy quiet
# about ``torch.*`` / ``cv2.*`` / ``timm.*`` re-exports.
module = ["torch.*", "cv2", "cv2.*", "timm", "timm.*", "facenet_pytorch", "facenet_pytorch.*", "decord", "decord.*", "pytorch_grad_cam", "pytorch_grad_cam.*", "insightface", "insightface.*", "filetype"]
ignore_missing_imports = true
